name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release tag
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: go test -race ./...
      - run: go build -o /tmp/kclaude-test-router ./cmd/kclaude-router
      - run: KCLAUDE_TEST_ROUTER=/tmp/kclaude-test-router python3 -m unittest discover -s tests -v
      - run: sh scripts/build-release.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "kclaude $GITHUB_REF_NAME" --notes-file RELEASE.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
