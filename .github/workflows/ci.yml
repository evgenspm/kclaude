name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/kclaude-test-router ./cmd/kclaude-router
      - run: KCLAUDE_TEST_ROUTER=/tmp/kclaude-test-router python3 -m unittest discover -s tests -v
      - run: sh -n install.sh scripts/build-release.sh
      - run: KCLAUDE_TARGETS=linux/amd64 sh scripts/build-release.sh
